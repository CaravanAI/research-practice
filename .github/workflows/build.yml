name: Build board and marketplace

# Runs after every merge to main. It rebuilds the marketplace list from the
# plugin folders and saves it back if it changed, then builds the board page
# from the card files and publishes it to GitHub Pages. The board page is
# never committed, so pull requests only ever touch their own card or plugin.
# (Pages only works once the repo is public.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One build at a time, so two quick merges do not collide.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so "last updated" can use commit times

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild board and marketplace
        run: python tools/build.py

      - name: Save changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild board and marketplace [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # The Pages steps only run once the repo is public. While it is
      # private they are skipped, so a merge does not show a red failure.
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
